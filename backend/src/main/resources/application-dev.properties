# 🛠️ Development-Specific Properties (Local Development)

# H2 Console enablement and configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Local Development Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:contactmanagerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA & Hibernate Local Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local Development JWT Secret Key
app.jwt.secret=${APP_JWT_SECRET:this_is_a_secure_development_signing_secret_key_which_is_long_enough}

# Development profile logging configurations
logging.level.com.tenpearls.contactmanager=DEBUG
logging.level.org.hibernate.SQL=DEBUG
