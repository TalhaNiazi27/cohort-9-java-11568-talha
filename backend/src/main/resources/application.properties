spring.application.name=contactmanager


# Database configuration (Production Settings - require environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# JPA & Hibernate configuration (validate schema in production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console configuration (disabled by default in production)
spring.h2.console.enabled=false

# Logging configurations
logging.level.root=INFO
logging.level.com.tenpearls.contactmanager=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

# Custom App Properties (JWT configuration)
# A secure 256-bit key for HMAC-SHA256 (supports APP_JWT_SECRET environment variable)
app.jwt.secret=${APP_JWT_SECRET}
# Token validity: 24 hours (86,400,000 milliseconds)
app.jwt.expiration-ms=86400000

# Whether the JWT cookie should be Secure (HTTPS only). Use environment variable for production.
app.jwt.cookie-secure=${APP_JWT_COOKIE_SECURE:true}
